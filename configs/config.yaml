gee_project_id: "ee-brodnow77"
sentinel2:
  start_date: "2022-09-01"
  end_date: "2022-11-30"
  bands: [B2, B3, B4, B8, B11, B12]
xgboost:
  max_depth: 8
  eta: 0.01717
  n_estimators: 1000
sampling:
  n_sampling_squares: 1000
  pv_squares: 600
  buffer_squares: 300
  urban_squares: 100
  buffer_km: 7
patch:
  size_px: 21
aoi:
  # Full Japan, matching plan.md's stated AOI. Imagery is never materialised
  # AOI-wide (that would be ~600 GB at 10 m) -- only one small GeoTIFF per
  # sampling square, so cost scales with sampling.n_sampling_squares.
  # The Kanto pilot used for pipeline validation was
  # name "kanto_pilot", bbox [139.5, 35.8, 140.5, 36.5] (8411 polygons).
  name: "japan"
  bbox: [129.0, 31.0, 146.0, 46.0]
split:
  # both are shares of the whole sample, i.e. roughly a 60/20/20 partition
  test_fraction: 0.2   # held out entirely; not read by the training scripts
  val_fraction: 0.2    # used for model selection
  block_size_km: 10
  seed: 42
paths:
  pv_polygons: "data/external/pv_polygons.gpkg"
  processed_dir: "data/processed"
