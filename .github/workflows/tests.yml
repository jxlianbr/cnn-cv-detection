name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install PyTorch (CPU build)
        # The CI runner has no GPU, and the default PyPI wheel drags in the
        # whole CUDA stack (~2 GB) for nothing.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Every test is offline: Earth Engine calls live in the *_smoke.py
        # scripts, which define no test functions and so are never executed.
        # -rs lists skip reasons, so a test skipped for a missing optional
        # download stays visible instead of quietly vanishing from the count.
        run: python -m pytest tests/ -q -rs
